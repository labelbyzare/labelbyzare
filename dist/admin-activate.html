<!DOCTYPE html>
<html lang="en-PK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow">
<title>Activate Admin Access | Label by Zare</title><link rel="icon" type="image/jpeg" href="images/logo-mark.jpg">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#eee8de;color:#29251f;font-family:Arial,sans-serif}.activate-card{width:min(470px,100%);padding:34px;border:1px solid #ddd1c0;background:#fffaf2;box-shadow:0 25px 70px rgba(55,44,28,.12)}.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}.brand img{width:38px;height:38px;border-radius:50%}.brand strong{font:500 15px Georgia,serif;letter-spacing:.08em}.eyebrow{color:#9b7747;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.18em}h1{margin:8px 0 10px;font:400 34px/1.05 Georgia,serif}p{color:#756c61;font-size:13px;line-height:1.65}.invite-meta{margin:18px 0;padding:14px 15px;border:1px solid #e3d8c8;background:#f8f2e9}.invite-meta strong,.invite-meta span{display:block}.invite-meta span{margin-top:5px;color:#8d8377;font-size:12px}.field{margin-top:14px}.field label{display:block;margin-bottom:6px;color:#5b5349;font-size:12px}.field input{width:100%;height:44px;padding:0 12px;border:1px solid #d8cbbb;background:#fff;font-size:14px}.btn{width:100%;min-height:44px;margin-top:18px;border:0;background:#29261f;color:#fff8ec;font-weight:700;letter-spacing:.04em;cursor:pointer}.btn:disabled{opacity:.55}.message{min-height:20px;margin-top:14px;font-size:12px}.message.error{color:#a6473d}.message.success{color:#35725d}.otp{display:none}.links{margin-top:16px;text-align:center;font-size:12px}.links a{color:#7c613a}code{word-break:break-all}
</style>
</head><body><main class="activate-card"><div class="brand"><img src="images/logo-mark.jpg" alt=""><strong>LABEL BY ZARE</strong></div><span class="eyebrow">Private team invitation</span><h1>Activate admin access</h1><p id="intro">Checking your secure invitation…</p><div class="invite-meta" id="invite-meta" hidden><strong id="invite-name"></strong><span id="invite-email"></span><span id="invite-role"></span></div><div id="activation-form" hidden><div class="field"><label for="password">Create password</label><input type="password" id="password" minlength="6" autocomplete="new-password"></div><div class="field"><label for="confirm-password">Confirm password</label><input type="password" id="confirm-password" minlength="6" autocomplete="new-password"></div><button class="btn" id="activate-btn" type="button">Create admin login</button></div><div class="otp" id="otp-step"><p>We sent a 6-digit verification code to <strong id="otp-email"></strong>.</p><div class="field"><label for="otp-code">Verification code</label><input type="text" id="otp-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456"></div><button class="btn" id="verify-btn" type="button">Verify &amp; activate</button></div><div class="message" id="message"></div><div class="links"><a href="login.html">Already activated? Admin Login</a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script>
<script>
const qs=new URLSearchParams(location.search),token=qs.get("token"),intro=document.getElementById("intro"),meta=document.getElementById("invite-meta"),form=document.getElementById("activation-form"),otpStep=document.getElementById("otp-step"),message=document.getElementById("message");let invite=null;
const roleLabel=r=>({owner:"Owner",managing_director:"Managing Director",admin:"Admin",viewer:"Viewer"}[r]||"Admin");
function setMessage(text,type=""){message.textContent=text;message.className="message"+(type?` ${type}`:"");}
async function loadInvite(){if(!token){intro.textContent="This activation link is incomplete.";setMessage("Ask the person who added you as an admin to generate a new activation link.","error");return;}const {data,error}=await supabaseClient.rpc("admin_invite_info",{p_token:token});invite=data?.[0];if(error||!invite){intro.textContent="This invitation is invalid or has expired.";setMessage("Ask an Owner or Managing Director for a fresh activation link.","error");return;}intro.textContent="You have been invited to the Label by Zare backend. Create your private login below.";meta.hidden=false;form.hidden=false;document.getElementById("invite-name").textContent=invite.full_name||"Admin user";document.getElementById("invite-email").textContent=invite.email;document.getElementById("invite-role").textContent=roleLabel(invite.role);}
document.getElementById("activate-btn").addEventListener("click",async()=>{const password=document.getElementById("password").value,confirm=document.getElementById("confirm-password").value,btn=document.getElementById("activate-btn");if(password.length<6){setMessage("Password must be at least 6 characters.","error");return;}if(password!==confirm){setMessage("Passwords do not match.","error");return;}btn.disabled=true;setMessage("Creating your admin login…");const {data,error}=await supabaseClient.auth.signUp({email:invite.email,password,options:{data:{full_name:invite.full_name||""}}});btn.disabled=false;if(error){setMessage(error.message.includes("already")?"This email already has an account. Use Admin Login with its existing password.":error.message,"error");return;}if(data.session){await supabaseClient.rpc("admin_claim_invite",{p_token:token});setMessage("Admin access activated. Redirecting…","success");location.href="admin.html";return;}form.hidden=true;otpStep.style.display="block";document.getElementById("otp-email").textContent=invite.email;setMessage("Enter the verification code from your email.");document.getElementById("otp-code").focus();});
document.getElementById("verify-btn").addEventListener("click",async()=>{const code=document.getElementById("otp-code").value.trim(),btn=document.getElementById("verify-btn");btn.disabled=true;const {error}=await supabaseClient.auth.verifyOtp({email:invite.email,token:code,type:"signup"});if(error){btn.disabled=false;setMessage(error.message,"error");return;}await supabaseClient.rpc("admin_claim_invite",{p_token:token});setMessage("Admin access activated. Redirecting…","success");location.href="admin.html";});
loadInvite();
</script></body></html>
