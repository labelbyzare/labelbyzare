[build]
  command = "node scripts/build-site.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[images]
  remote_images = ['https://ldpzgtjbnbdsggaqmuvs\.supabase\.co/storage/v1/object/public/product-images/.*']

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/home-page"
  status = 200
  force = true

[[redirects]]
  from = "/collections/*"
  to = "/.netlify/functions/collection-page"
  status = 200

[[redirects]]
  from = "/journal/*"
  to = "/.netlify/functions/journal-page"
  status = 200

[[redirects]]
  from = "/journal"
  to = "/.netlify/functions/journal-page"
  status = 200

[[redirects]]
  from = "/search"
  to = "/.netlify/functions/collection-page"
  status = 200

[[redirects]]
  from = "/sitemap-pages.xml"
  to = "/.netlify/functions/sitemap-pages"
  status = 200
  force = true

[[redirects]]
  from = "/product-feed.xml"
  to = "/.netlify/functions/product-feed"
  status = 200

[[redirects]]
  from = "/product.html"
  to = "/.netlify/functions/product-page"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap-products.xml"
  to = "/.netlify/functions/sitemap-products"
  status = 200

# Crawlable HTML product index — a real linked page (not just an XML
# feed) pointing at every product URL.
[[redirects]]
  from = "/sitemap.html"
  to = "/.netlify/functions/sitemap-html"
  status = 200

# Server-rendered product pages — real title/meta/JSON-LD baked in per
# product so crawlers and social-preview bots don't need to run JS.
# New keyword-slug URLs: /product/<slug>/<id>
[[redirects]]
  from = "/product/*"
  to = "/.netlify/functions/product-page"
  status = 200

# Legacy /product?id=<id> links (already shared/bookmarked before the
# slug scheme existed) still render via the same function, which then
# 301s them to their canonical slug URL.
[[redirects]]
  from = "/product"
  to = "/.netlify/functions/product-page"
  status = 200
  force = true
  query = {id = ":id"}

# Pretty URLs — matches labelbyzare.com live routes
[[redirects]]
  from = "/shop"
  to = "/.netlify/functions/collection-page"
  status = 200
  force = true

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/new-arrivals"
  to = "/.netlify/functions/collection-page"
  status = 200
  force = true

[[redirects]]
  from = "/sale"
  to = "/.netlify/functions/collection-page"
  status = 200
  force = true

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/reviews"
  to = "/reviews.html"
  status = 200

[[redirects]]
  from = "/track-order"
  to = "/track-order.html"
  status = 200

[[redirects]]
  from = "/cart"
  to = "/cart.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

[[redirects]]
  from = "/wishlist"
  to = "/wishlist.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/account.html"
  status = 200

[[redirects]]
  from = "/account-login"
  to = "/account-login.html"
  status = 200

[[redirects]]
  from = "/account-signup"
  to = "/account-signup.html"
  status = 200

[[redirects]]
  from = "/reset-password"
  to = "/reset-password.html"
  status = 200

[[redirects]]
  from = "/product"
  to = "/.netlify/functions/product-page"
  status = 200
  force = true

[[redirects]]
  from = "/shop.html"
  to = "/shop"
  status = 301
  force = true

[[redirects]]
  from = "/new-arrivals.html"
  to = "/new-arrivals"
  status = 301
  force = true

[[redirects]]
  from = "/sale.html"
  to = "/sale"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
